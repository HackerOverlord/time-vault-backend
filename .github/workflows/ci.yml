name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: pytest -q tests
        env:
          # Throwaway values for the test run only; tests never touch real
          # storage, email or the production database.
          SECRET_KEY: ci-only-secret
          ENCRYPTION_KEY: ci-only-encryption-key
          RUN_JOBS_ON_REQUEST: "0"
